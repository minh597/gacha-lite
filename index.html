<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mở Hộp Quà May Mắn</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif;
            background: radial-gradient(circle at center, #2e1065 0%, #0f172a 100%);
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* 3D Box Container */
        .gift-box-wrapper {
            perspective: 800px;
            cursor: pointer;
        }

        .gift-box {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto;
            transform-style: preserve-3d;
            transition: transform 0.3s ease;
        }

        .gift-box:hover {
            transform: scale(1.05);
        }

        /* Box Base */
        .box-body {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ef4444, #991b1b);
            border-radius: 16px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.4);
            border: 2px solid #f87171;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ribbons */
        .ribbon-v {
            position: absolute;
            width: 32px;
            height: 100%;
            background: linear-gradient(to right, #f59e0b, #fbbf24, #d97706);
            left: calc(50% - 16px);
            z-index: 2;
        }

        .ribbon-h {
            position: absolute;
            width: 100%;
            height: 32px;
            background: linear-gradient(to bottom, #f59e0b, #fbbf24, #d97706);
            top: calc(50% - 16px);
            z-index: 2;
        }

        /* Box Lid */
        .box-lid {
            position: absolute;
            top: -12px;
            left: -10px;
            width: 200px;
            height: 48px;
            background: linear-gradient(135deg, #f87171, #dc2626);
            border-radius: 12px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.4);
            border: 2px solid #fca5a5;
            z-index: 5;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
            transform-origin: top center;
        }

        /* Bow */
        .bow {
            position: absolute;
            top: -26px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 26px;
            z-index: 6;
        }

        .bow-loop {
            position: absolute;
            width: 28px;
            height: 24px;
            background: #fbbf24;
            border-radius: 50% 50% 0 50%;
            border: 2px solid #d97706;
        }

        .bow-left { left: 0; transform: rotate(-25deg); }
        .bow-right { right: 0; transform: scaleX(-1) rotate(-25deg); }

        /* Animations */
        .shake {
            animation: shake 0.5s ease-in-out infinite;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg) scale(1); }
            20% { transform: rotate(-6deg) scale(1.05); }
            40% { transform: rotate(6deg) scale(1.05); }
            60% { transform: rotate(-4deg) scale(1.08); }
            80% { transform: rotate(4deg) scale(1.08); }
        }

        .lid-open {
            transform: translateY(-100px) rotate(-30deg) scale(0.9) !important;
            opacity: 0;
        }

        .float-anim {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .gift-glow {
            filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.6));
        }
    </style>
</head>
<body class="flex flex-col min-h-screen items-center justify-between p-4">

    <!-- Header -->
    <header class="text-center mt-6">
        <h1 class="text-3xl md:text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r from-amber-300 via-pink-400 to-purple-400">
            🎁 MỞ HỘP QUÀ
        </h1>

        <!-- Gift Check Button -->
        <div class="flex items-center justify-center gap-2 mt-4">
            <button onclick="openGiftListModal()" class="px-4 py-2 rounded-full bg-slate-800/80 hover:bg-slate-700 text-amber-300 text-xs font-bold border border-amber-500/30 shadow transition-all flex items-center gap-2 active:scale-95">
                <i class="fa-solid fa-list-check"></i>
                <span>Xem danh sách quà</span>
                <span id="gift-count-badge" class="bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full text-[10px]">0 quà</span>
            </button>
        </div>
    </header>

    <!-- Main Interactive Area -->
    <main class="flex flex-col items-center justify-center my-auto w-full max-w-sm">
        
        <div class="gift-box-wrapper my-8 float-anim" onclick="openGiftBox()">
            <div id="gift-box" class="gift-box">
                <!-- Lid -->
                <div id="box-lid" class="box-lid">
                    <div class="ribbon-v"></div>
                    <div class="bow">
                        <div class="bow-loop bow-left"></div>
                        <div class="bow-loop bow-right"></div>
                    </div>
                </div>

                <!-- Body -->
                <div class="box-body">
                    <div class="ribbon-v"></div>
                    <div class="ribbon-h"></div>
                    <i class="fa-solid fa-question text-5xl text-amber-200/40"></i>
                </div>
            </div>
        </div>

        <!-- Redeem Code Input Area -->
        <div class="w-full flex flex-col gap-1 mb-3">
            <div class="flex gap-2 w-full">
                <input type="text" id="redeem-input" placeholder="Enter code here" class="flex-1 px-4 py-2.5 rounded-xl bg-slate-800/90 border border-slate-700 text-white placeholder-slate-400 text-sm focus:outline-none focus:border-amber-400 transition-all" />
                <button onclick="handleRedeem()" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-300 hover:to-yellow-400 text-slate-950 font-bold text-sm shadow transition-all active:scale-95 whitespace-nowrap">
                    Redeem
                </button>
            </div>
            <p id="redeem-msg" class="text-xs text-center min-h-[18px] transition-all"></p>
        </div>

        <!-- ROLL Button -->
        <button id="open-btn" onclick="openGiftBox()" class="w-full py-4 px-8 rounded-2xl bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-300 hover:to-yellow-400 text-slate-950 font-black text-xl tracking-wider shadow-lg shadow-amber-500/30 active:scale-95 transition-all flex items-center justify-center space-x-2">
            <i class="fa-solid fa-dice text-2xl"></i>
            <span>ROLL</span>
        </button>
    </main>

    <!-- Modal Popup for Result -->
    <div id="result-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm hidden">
        <div class="bg-slate-900 border-2 border-amber-400/50 rounded-3xl p-6 text-center max-w-xs w-full shadow-2xl transform transition-all scale-100">
            
            <p class="text-xs font-black text-amber-400 uppercase tracking-widest mb-2">🎉 CHÚC MỪNG BẠN!</p>
            
            <!-- Gift Visual Container -->
            <div id="gift-icon-container" class="h-24 flex items-center justify-center my-3">
                <div id="gift-icon" class="text-6xl animate-bounce gift-glow">🎁</div>
            </div>

            <!-- Gift Name -->
            <h2 id="gift-title" class="text-2xl font-black text-white mb-6">
                Tên Quà Tặng
            </h2>

            <!-- Action Button -->
            <button onclick="closeModal()" class="w-full py-3 rounded-xl bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-300 hover:to-yellow-400 text-slate-950 font-black text-base shadow-md transition-all">
                Thử Lại 🔄
            </button>
        </div>
    </div>

    <!-- Modal View Gift List -->
    <div id="gift-list-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm hidden">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-5 max-w-xs w-full shadow-2xl flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center pb-3 border-b border-slate-800">
                <h3 class="text-base font-black text-amber-300 flex items-center gap-2">
                    <i class="fa-solid fa-boxes-stacked"></i> Danh Sách Quà
                </h3>
                <button onclick="closeGiftListModal()" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div id="gift-list-container" class="overflow-y-auto my-3 space-y-2 pr-1 flex-1">
                <!-- Items populated here dynamically -->
            </div>

            <button onclick="closeGiftListModal()" class="w-full py-2.5 mt-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm transition-all">
                Đóng
            </button>
        </div>
    </div>

    <script>
        const GIFT_URL = "https://raw.githubusercontent.com/minh597/gacha-lite/refs/heads/main/gift.json";

        // Image mapping for different gift types and keywords
        const GIFT_IMAGES = {
            discount: "https://i.postimg.cc/dQbZJsM8/images.jpg",
            gems: "https://i.postimg.cc/MHVTnBk8/Gem-V2.webp",
            coins: "https://i.postimg.cc/pXMrgs8X/Coin.webp",
            rewards: "https://i.postimg.cc/MTXdRymg/images-(1).jpg"
        };

        // Default initial gift list mirroring the JSON structure
        let gifts = [
            { type: "discount", name: "Giảm 5K / 50K Coins", uid: "5832147" },
            { type: "discount", name: "Giảm 10K trên tổng hóa đơn", uid: "" },
            { type: "free_coins", name: "Tặng 50K Coins", uid: "" },
            { type: "free_gems", name: "Tặng 1K Gems", uid: "" },
            { type: "rewards", name: "Tặng 30 Wins", uid: "" }
        ];

        // Redeem codes list & single-use ticket state
        let redeemCodes = [];
        let pendingGuaranteedGift = null;
        let activeCodeIndex = -1;
        let hasRollTicket = false;

        function getGiftMedia(item) {
            if (!item) return { type: 'icon', value: '🎁' };

            // 1. Explicit image specified in item JSON
            if (item.image || item.img) {
                return { type: 'image', src: item.image || item.img };
            }

            const typeLower = (item.type || '').toLowerCase();
            const nameLower = (item.name || item.text || item.title || '').toLowerCase();

            // 2. Direct mapping by JSON 'type' field
            if (typeLower === 'discount') return { type: 'image', src: GIFT_IMAGES.discount };
            if (typeLower === 'free_gems' || typeLower === 'gems' || typeLower === 'gem') return { type: 'image', src: GIFT_IMAGES.gems };
            if (typeLower === 'free_coins' || typeLower === 'coins' || typeLower === 'coin') return { type: 'image', src: GIFT_IMAGES.coins };
            if (typeLower === 'rewards' || typeLower === 'reward' || typeLower === 'win') return { type: 'image', src: GIFT_IMAGES.rewards };

            // 3. Fallback keyword matching in 'text' / 'name'
            if (nameLower.includes('gem') || nameLower.includes('đá quý') || nameLower.includes('kim cương') || nameLower.includes('ruby')) {
                return { type: 'image', src: GIFT_IMAGES.gems };
            }

            if (nameLower.includes('coin') || nameLower.includes('xu') || nameLower.includes('vàng') || nameLower.includes('tiền')) {
                return { type: 'image', src: GIFT_IMAGES.coins };
            }

            if (nameLower.includes('discount') || nameLower.includes('giảm') || nameLower.includes('voucher') || nameLower.includes('coupon') || nameLower.includes('%')) {
                return { type: 'image', src: GIFT_IMAGES.discount };
            }

            if (nameLower.includes('win') || nameLower.includes('reward') || nameLower.includes('thưởng')) {
                return { type: 'image', src: GIFT_IMAGES.rewards };
            }

            // 4. Explicit icon or emoji from JSON
            if (item.icon || item.emoji) {
                return { type: 'icon', value: item.icon || item.emoji };
            }

            // 5. Default gift icon fallback
            return { type: 'icon', value: "🎁" };
        }

        async function fetchGiftsFromGitHub() {
            try {
                const response = await fetch(GIFT_URL + '?t=' + Date.now());
                if (!response.ok) throw new Error("HTTP Status " + response.status);

                const rawText = await response.text();
                let fetchedGifts = [];
                let fetchedCodes = [];

                try {
                    const parsed = JSON.parse(rawText);
                    if (Array.isArray(parsed)) {
                        parsed.forEach(item => {
                            if (typeof item === 'string') {
                                fetchedGifts.push({ name: item.trim(), type: '', uid: '' });
                            } else if (typeof item === 'object' && item !== null) {
                                // Extract redeem code object
                                if (item.code) {
                                    fetchedCodes.push({
                                        code: String(item.code).trim(),
                                        uid: String(item.uid || '').trim(),
                                        type: item.type || '',
                                        text: item.text || item.name || item.title || ''
                                    });
                                }

                                // Extract gift object
                                if (item.text || item.name || item.title || (item.type && !item.code)) {
                                    fetchedGifts.push({
                                        uid: String(item.uid || item.id || '').trim(),
                                        type: item.type || '',
                                        name: item.text || item.name || item.title || item.gift || "Phần quà",
                                        icon: item.icon || item.emoji || null,
                                        image: item.image || item.img || null
                                    });
                                }
                            }
                        });
                    } else if (typeof parsed === 'object' && parsed !== null) {
                        const arr = parsed.gifts || parsed.items || parsed.data || [];
                        if (Array.isArray(arr)) {
                            arr.forEach(item => {
                                if (typeof item === 'object' && item !== null) {
                                    if (item.code) {
                                        fetchedCodes.push({ code: String(item.code).trim(), uid: String(item.uid || '').trim() });
                                    }
                                    if (item.text || item.name) {
                                        fetchedGifts.push({
                                            uid: String(item.uid || '').trim(),
                                            type: item.type || '',
                                            name: item.text || item.name || 'Quà',
                                            icon: item.icon || item.emoji || null,
                                            image: item.image || item.img || null
                                        });
                                    }
                                }
                            });
                        }
                    }
                } catch (e) {
                    console.error("Error parsing JSON:", e);
                }

                if (fetchedGifts.length > 0) {
                    gifts = fetchedGifts;
                    updateGiftCountBadge();
                    renderGiftList();
                }

                if (fetchedCodes.length > 0) {
                    redeemCodes = fetchedCodes;
                }
            } catch (err) {
                console.warn("Không thể tải gift.json, sử dụng danh sách mặc định:", err);
                updateGiftCountBadge();
            }
        }

        function updateGiftCountBadge() {
            const badge = document.getElementById('gift-count-badge');
            if (badge) badge.innerText = `${gifts.length} quà`;
        }

        function renderGiftList() {
            const container = document.getElementById('gift-list-container');
            if (!container) return;

            if (gifts.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-400 py-6 text-sm">Chưa có phần quà nào</div>`;
                return;
            }

            container.innerHTML = gifts.map((item, idx) => {
                const media = getGiftMedia(item);
                const isReward = (item.type || '').toLowerCase() === 'rewards';
                const imgClass = isReward ? 'w-6 h-6 object-contain' : 'w-8 h-8 object-contain';
                const visual = media.type === 'image' 
                    ? `<img src="${media.src}" class="${imgClass} rounded-lg drop-shadow" alt="${item.name}" onerror="this.onerror=null;this.parentNode.innerHTML='🎁';">`
                    : `<span class="text-2xl">${media.value}</span>`;

                return `
                    <div class="flex items-center gap-3 p-2.5 rounded-xl bg-slate-800/80 border border-slate-700/50 hover:border-amber-500/30 transition-all">
                        <div class="w-8 h-8 flex justify-center items-center shrink-0">${visual}</div>
                        <span class="text-sm font-semibold text-slate-200 flex-1 truncate">${item.name}</span>
                        <span class="text-[10px] text-slate-500 font-mono">#${idx + 1}</span>
                    </div>
                `;
            }).join('');
        }

        function openGiftListModal() {
            renderGiftList();
            document.getElementById('gift-list-modal').classList.remove('hidden');
        }

        function closeGiftListModal() {
            document.getElementById('gift-list-modal').classList.add('hidden');
        }

        function handleRedeem() {
            const input = document.getElementById('redeem-input');
            const msg = document.getElementById('redeem-msg');
            if (!input || !msg) return;

            const code = input.value.trim();
            if (!code) {
                msg.className = "text-xs text-center text-amber-400 font-medium";
                msg.innerText = "Vui lòng nhập mã!";
                return;
            }

            // Search in redeemCodes list for available code
            const codeIndex = redeemCodes.findIndex(c => c.code.toLowerCase() === code.toLowerCase());

            if (codeIndex !== -1) {
                const matchedCodeObj = redeemCodes[codeIndex];
                // Find gift with matching UID
                let targetGift = gifts.find(g => g.uid && g.uid === matchedCodeObj.uid);

                // If not found in gifts by UID, create gift object if code object had gift info
                if (!targetGift && matchedCodeObj.text) {
                    targetGift = {
                        type: matchedCodeObj.type || '',
                        name: matchedCodeObj.text,
                        uid: matchedCodeObj.uid
                    };
                }

                if (targetGift) {
                    pendingGuaranteedGift = targetGift;
                    activeCodeIndex = codeIndex;
                    hasRollTicket = true;

                    msg.className = "text-xs text-center text-emerald-400 font-bold";
                    msg.innerText = `Mã hợp lệ! Bạn nhận được 1 lượt ROLL. Hãy nhấn ROLL!`;
                    input.value = "";
                    return;
                }
            }

            msg.className = "text-xs text-center text-red-400 font-medium";
            msg.innerText = `Mã "${code}" không hợp lệ hoặc đã được sử dụng!`;
            input.value = "";

            setTimeout(() => {
                if (msg.innerText.includes("không hợp lệ")) {
                    msg.innerText = "";
                }
            }, 3000);
        }

        let isOpening = false;

        function openGiftBox() {
            if (isOpening) return;

            const msg = document.getElementById('redeem-msg');

            // Strictly require a valid redeem ticket to roll
            if (!hasRollTicket || !pendingGuaranteedGift) {
                if (msg) {
                    msg.className = "text-xs text-center text-amber-400 font-bold animate-pulse";
                    msg.innerText = "⚠️ Bạn phải nhập mã Redeem hợp lệ trước khi ROLL!";
                }
                return;
            }

            isOpening = true;

            const box = document.getElementById('gift-box');
            const lid = document.getElementById('box-lid');
            const btn = document.getElementById('open-btn');

            // 1. Shake animation
            box.classList.add('shake');
            btn.disabled = true;
            btn.classList.add('opacity-50');

            // 2. Lift lid after shake
            setTimeout(() => {
                box.classList.remove('shake');
                lid.classList.add('lid-open');

                // 3. Select guaranteed gift from code and DELETE code permanently
                setTimeout(() => {
                    const selectedGift = pendingGuaranteedGift;

                    // DELETE the redeemed code from array memory completely
                    if (activeCodeIndex !== -1 && activeCodeIndex < redeemCodes.length) {
                        redeemCodes.splice(activeCodeIndex, 1);
                    }

                    // Reset roll ticket state
                    pendingGuaranteedGift = null;
                    activeCodeIndex = -1;
                    hasRollTicket = false;

                    if (msg) msg.innerText = "";

                    const media = getGiftMedia(selectedGift);
                    const iconContainer = document.getElementById('gift-icon-container');

                    if (media.type === 'image') {
                        const isReward = (selectedGift.type || '').toLowerCase() === 'rewards';
                        const imgSizeClass = isReward ? 'h-[68px] w-[68px]' : 'h-20 w-20';
                        iconContainer.innerHTML = `<img src="${media.src}" class="${imgSizeClass} object-contain animate-bounce gift-glow" alt="${selectedGift.name}" onerror="this.onerror=null;this.parentNode.innerHTML='<div class=\\'text-6xl animate-bounce gift-glow\\'>🎁</div>';">`;
                    } else {
                        iconContainer.innerHTML = `<div id="gift-icon" class="text-6xl animate-bounce gift-glow">${media.value}</div>`;
                    }

                    document.getElementById('gift-title').innerText = selectedGift.name;

                    // Confetti explosion
                    if (typeof confetti === 'function') {
                        confetti({
                            particleCount: 70,
                            spread: 60,
                            origin: { y: 0.6 }
                        });
                    }

                    // Show result modal
                    document.getElementById('result-modal').classList.remove('hidden');
                }, 300);

            }, 600);
        }

        function closeModal() {
            document.getElementById('result-modal').classList.add('hidden');
            
            // Reset box state
            const lid = document.getElementById('box-lid');
            const btn = document.getElementById('open-btn');
            
            lid.classList.remove('lid-open');
            btn.disabled = false;
            btn.classList.remove('opacity-50');
            
            isOpening = false;
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            updateGiftCountBadge();
            fetchGiftsFromGitHub();
        });
    </script>
</body>
</html>
